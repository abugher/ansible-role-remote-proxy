---
proxy_target:           'http://remote.neuronpointer.net'
create_files:
  - owner:              'root'
    group:              'www-data'
    mode:               '0750'
    path:               '/etc/remote-proxy'
    state:              'directory'
template_files:
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "{{ role_path }}/templates/remote.ssl.j2"
    dest:               "/etc/nginx/sites-available/remote.ssl"
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "{{ role_path }}/templates/remote.j2"
    dest:               "/etc/nginx/sites-available/remote"
install_files:
  - owner:              'root'
    group:              'www-data'
    mode:               '0640'
    src:                'sensitive/files/conf/htpasswd.users'
    dest:               '/etc/remote-proxy/htpasswd.users'
symlinks:
  - owner:              'root'
    group:              'root'
    src:                "/etc/nginx/sites-available/remote"
    dest:               "/etc/nginx/sites-enabled/remote"
  - owner:              'root'
    group:              'root'
    src:                "/etc/nginx/sites-available/remote.ssl"
    dest:               "/etc/nginx/sites-enabled/remote.ssl"
restart_services:
  - 'nginx'
  - 'nginx'
